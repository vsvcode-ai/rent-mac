<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的账户 · 南洋桌面</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap acct">
  <nav class="side" id="side">
    <div class="me"><b id="me-email"></b><small id="me-sub"></small></div>
    <a href="#overview" data-v="overview">概览</a>
    <a href="#orders" data-v="orders">我的订单<span class="cnt" id="cnt-orders" style="display:none"></span></a>
    <a href="#devices" data-v="devices">我的设备</a>
    <a href="#tickets" data-v="tickets">工单</a>
    <a href="#settings" data-v="settings">账户设置</a>
    <a href="#" id="logout" style="color:var(--danger)">退出登录</a>
  </nav>
  <div>
    <section class="view" id="v-overview"></section>
    <section class="view" id="v-orders"></section>
    <section class="view" id="v-devices"></section>
    <section class="view" id="v-tickets"></section>
    <section class="view" id="v-settings"></section>
  </div>
</main>
<footer id="site-footer"></footer>

<!-- 续费弹窗 -->
<div class="modal-bg" id="modal-renew"><div class="modal">
  <button class="x" onclick="NYD.closeModal('renew')">✕</button>
  <h3>续费</h3><p class="muted" style="font-size:14px;margin-bottom:20px" id="renew-sub"></p>
  <div id="renew-opts" style="display:grid;gap:10px"></div>
  <div class="line-item" style="margin-top:18px"><span>续费后到期时间</span><b id="renew-end"></b></div>
  <div class="total"><span>应付</span><strong style="font-size:34px"><small style="font-size:18px">¥</small><span id="renew-total"></span></strong></div>
  <button class="btn btn-primary btn-lg btn-block" id="renew-go" style="margin-top:12px">生成续费订单</button>
  <p class="fine">续费同样到闲鱼付款，客服确认后自动延长到期时间</p>
</div></div>
<!-- 工单弹窗 -->
<div class="modal-bg" id="modal-ticket"><div class="modal">
  <button class="x" onclick="NYD.closeModal('ticket')">✕</button>
  <h3>提交工单</h3><p class="muted" style="font-size:14px;margin-bottom:20px">我们通常在 2 小时内响应（10:00–23:00）</p>
  <div class="field"><label>问题类型</label><select class="input" id="t-cat"><option>无法连接</option><option>机器卡顿</option><option>重置密码</option><option>重启机器</option><option>其他</option></select></div>
  <div class="field"><label>相关设备</label><select class="input" id="t-dev"></select></div>
  <div class="field"><label>问题描述</label><textarea class="input" id="t-text" placeholder="请描述你遇到的问题，越具体越好"></textarea><div class="errmsg">请填写问题描述</div></div>
  <button class="btn btn-primary btn-lg btn-block" id="t-go">提交工单</button>
</div></div>

<script src="assets/app.js"></script>
<script>
NYD.init('');
if (!NYD.requireLogin()) throw 0;
const S = NYD.S, U = S.user, $ = id => document.getElementById(id);
const VIEWS = ['overview', 'orders', 'devices', 'tickets', 'settings'];
const mask = s => '•'.repeat(Math.max(8, s.length));
const myLeases = () => NYD.myOrders().filter(o => ['active', 'done'].includes(o.status) && o.kind === 'new').flatMap(o => o.devices.map(d => ({ ...d, order: o })));
const leaseEnd = l => l.order.endAt;
function leaseState(l) { const left = leaseEnd(l) - Date.now(); if (left < 0) return { t: left > -3 * NYD.DAY ? '宽限期' : '已到期', c: 'danger' }; if (left < 7 * NYD.DAY) return { t: '即将到期', c: 'warn' }; return { t: '使用中', c: 'ok' }; }

$('me-email').textContent = U.email; $('me-sub').textContent = '普通用户';
$('logout').onclick = e => { e.preventDefault(); NYD.logout(); location.href = 'index.html'; };

/* ---------- 概览 ---------- */
function vOverview() {
  const L = myLeases(), orders = NYD.myOrders(), pend = orders.filter(o => ['pending', 'verifying', 'queued'].includes(o.status));
  const soon = L.map(leaseEnd).sort((a, b) => a - b)[0];
  const vip = orders.some(o => NYD.plan(o.plan).support && ['active', 'queued', 'done'].includes(o.status));
  $('v-overview').innerHTML = `<h2>你好，${U.email.split('@')[0]}</h2>
    <div class="stats"><div class="stat"><small>在租设备</small><b>${L.length}</b><span>台 Mac mini</span></div>
      <div class="stat"><small>最近到期</small><b style="font-size:26px;line-height:44px">${soon ? NYD.fmtDate(soon) : '—'}</b><span>${soon ? (Math.ceil((soon - Date.now()) / NYD.DAY) + ' 天后') : '暂无设备'}</span></div>
      <div class="stat"><small>待处理订单</small><b>${pend.length}</b><span>${pend.length ? '需要关注' : '全部处理完毕'}</span></div></div>
    ${vip ? `<div class="vip"><div class="av">客</div><div><b>你的 1 对 1 专属客服</b><small>半年付、年付用户专享 · 微信 nyd_vip_lily · 响应优先</small></div><button class="btn btn-white btn-sm" onclick="NYD.modal('support')">联系她</button></div>`
      : `<div class="vip" style="background:var(--bg);border:1px dashed var(--line2)"><div class="av">★</div><div><b>升级半年付或年付，享 1 对 1 专属客服</b><small>每月最低 ¥499，比月付省 ¥3,600 / 年</small></div><a class="btn btn-dark btn-sm" href="index.html#pricing">查看套餐</a></div>`}
    ${pend.length ? `<div class="alert warn"><span>!</span><div><b>你有 ${pend.length} 个订单正在进行中。</b> ${pend.map(o => `<a class="link" href="pay.html?no=${o.no}">${o.no}（${NYD.STATUS[o.status].t}）</a>`).join('、')}</div></div>` : ''}
    <h3 style="margin:26px 0 14px;font-size:18px">最近订单</h3>${ordersTable(orders.slice(0, 4))}`;
}
function ordersTable(list) {
  if (!list.length) return `<div class="tbl-wrap"><div class="empty"><b>还没有订单</b>选一个套餐，开始你的第一台 Mac。<br><a class="btn btn-primary btn-sm" style="margin-top:16px" href="index.html#pricing">去选套餐</a></div></div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>订单号</th><th>类型</th><th>套餐</th><th>金额</th><th>状态</th><th>时间</th><th></th></tr></thead><tbody>${list.map(o => {
    const p = NYD.plan(o.plan), pr = NYD.price(o.plan, o.qty);
    const act = o.status === 'pending' ? `<a class="btn btn-primary btn-sm" href="pay.html?no=${o.no}">去付款</a>` : `<a class="link" href="pay.html?no=${o.no}">详情</a>`;
    return `<tr><td class="mono">${o.no}</td><td>${o.kind === 'renew' ? '续费' : '新租'}</td><td>${p.name} × ${o.qty} 台</td><td><b>${NYD.money(pr.total)}</b></td><td>${NYD.pill(o.status)}</td><td class="muted" style="font-size:13px">${NYD.fmtDate(o.createdAt)}</td><td>${act}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function vOrders() { $('v-orders').innerHTML = `<h2>我的订单</h2>${ordersTable(NYD.myOrders())}`; }

/* ---------- 设备 ---------- */
const shown = new Set();
function vDevices() {
  const L = myLeases();
  if (!L.length) { $('v-devices').innerHTML = `<h2>我的设备</h2><div class="tbl-wrap"><div class="empty"><b>还没有开通的设备</b>付款并开通后，连接信息会出现在这里。</div></div>`; return; }
  $('v-devices').innerHTML = `<h2>我的设备<a class="btn btn-ghost btn-sm" href="help.html">UU 远程连接教程</a></h2>` + L.map(l => {
    const st = leaseState(l), o = l.order, total = leaseEnd(l) - o.activatedAt, left = leaseEnd(l) - Date.now(), pct = Math.max(0, Math.min(100, left / total * 100)), days = Math.ceil(left / NYD.DAY);
    const key = l.code, vis = shown.has(key);
    const row = (lbl, v, secret) => `<div class="cred-row"><span>${lbl}</span><code>${secret && !vis ? mask(v) : v}</code><button onclick="NYD.copy('${v}','已复制${lbl}')">复制</button></div>`;
    return `<div class="dev"><div class="dev-top"><div class="dev-ic"><i></i></div><div><h3>${l.code}</h3><small>Mac mini M4 · 16GB · 256GB · 马来西亚机房</small></div>
      <div class="acts"><span class="pill ${st.c}" style="align-self:center">${st.t}</span><button class="btn btn-primary btn-sm" onclick="openRenew('${l.code}')">续费</button><button class="btn btn-line btn-sm" onclick="openTicket('${l.code}')">报修</button></div></div>
      <div class="dev-meta"><div><small>固定 IP</small><b class="mono">${l.ip}</b></div><div><small>订单</small><b class="mono" style="font-size:13px">${o.no}</b></div><div><small>起租</small><b>${NYD.fmtDate(o.activatedAt)}</b></div><div><small>到期</small><b>${NYD.fmtDate(leaseEnd(l))}</b></div></div>
      <div class="life"><div><span>租期剩余</span><span><b style="color:${days < 7 ? 'var(--danger)' : 'var(--ink)'}">${days > 0 ? days + ' 天' : '已到期'}</b></span></div><div class="bar"><i class="${days < 7 ? 'low' : ''}" style="width:${pct}%"></i></div></div>
      ${days < 7 && days > -3 ? `<div class="alert warn"><span>!</span><div><b>${days > 0 ? '租期即将到期' : '已进入 3 天宽限期'}</b>。请尽快续费，宽限期结束后机器将被回收并抹盘重装，数据无法找回。</div></div>` : ''}
      <div class="cred"><div class="cred-head"><b>UU 远程连接信息</b><button class="btn btn-ghost btn-sm" onclick="toggleCred('${key}')">${vis ? '隐藏' : '显示'}</button></div>
        ${row('UU 设备代码', l.uuCode, 0)}${row('UU 连接密码', l.uuPwd, 1)}${row('macOS 用户名', l.macUser, 0)}${row('macOS 登录密码', l.macPwd, 1)}
        <p class="muted" style="font-size:12.5px;margin-top:12px">查看凭证会被记录。请勿转发给他人；如怀疑泄露，提交「重置密码」工单。</p></div></div>`;
  }).join('');
}
window.toggleCred = k => { shown.has(k) ? shown.delete(k) : shown.add(k); vDevices(); };

/* ---------- 续费 ---------- */
let rn = null, rp = 'm12';
window.openRenew = code => {
  const l = myLeases().find(x => x.code === code); rn = l; rp = 'm12';
  $('renew-sub').textContent = `${l.code} · 当前到期 ${NYD.fmtDate(leaseEnd(l))}`;
  $('renew-opts').innerHTML = NYD.PLANS.map(p => `<label class="term" style="display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;box-shadow:none;border:2px solid var(--line)"><input type="radio" name="rp" value="${p.id}" style="accent-color:var(--brand)" ${p.id === rp ? 'checked' : ''}><b>${p.name}</b><span class="muted" style="font-size:13px">¥${p.monthly} / 月</span><b style="margin-left:auto">${NYD.money(p.monthly * p.months)}</b></label>`).join('');
  $('renew-opts').querySelectorAll('input').forEach(i => i.onchange = () => { rp = i.value; calcRenew(); });
  calcRenew(); NYD.modal('renew');
};
function calcRenew() {
  const p = NYD.plan(rp), base = Math.max(leaseEnd(rn), Date.now());
  $('renew-total').textContent = (p.monthly * p.months).toLocaleString('zh-CN');
  $('renew-end').textContent = NYD.fmtDate(NYD.addMonths(base, p.months));
  $('renew-opts').querySelectorAll('.term').forEach(t => t.style.borderColor = t.querySelector('input').checked ? 'var(--brand)' : 'var(--line)');
}
$('renew-go').onclick = () => {
  const o = NYD.createOrder({ plan: rp, qty: 1, kind: 'renew', renewOf: rn.code, contact: { wechat: U.wechat, telegram: U.telegram } });
  location.href = 'pay.html?no=' + o.no;
};

/* ---------- 工单 ---------- */
window.openTicket = code => {
  $('t-dev').innerHTML = myLeases().map(l => `<option ${l.code === code ? 'selected' : ''}>${l.code}</option>`).join('') || '<option>（无设备）</option>';
  $('t-text').value = ''; NYD.modal('ticket');
};
$('t-go').onclick = () => {
  const v = $('t-text').value.trim(); $('t-text').closest('.field').classList.toggle('bad', !v); if (!v) return;
  S.ticketSeq++; S.tickets.unshift({ id: 'T26111' + String(S.ticketSeq).padStart(5, '0'), email: U.email, cat: $('t-cat').value, dev: $('t-dev').value, content: v, status: '待处理', createdAt: Date.now() });
  NYD.save(); NYD.closeModal('ticket'); NYD.toast('工单已提交'); vTickets();
};
function vTickets() {
  const list = S.tickets.filter(t => t.email === U.email);
  const c = { '待处理': 'warn', '处理中': 'info', '已解决': 'ok' };
  $('v-tickets').innerHTML = `<h2>工单<button class="btn btn-primary btn-sm" onclick="openTicket()">提交工单</button></h2>` + (list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>编号</th><th>类型</th><th>内容</th><th>状态</th><th>提交时间</th></tr></thead><tbody>${list.map(t => `<tr><td class="mono">${t.id}</td><td>${t.cat}</td><td style="max-width:300px">${t.content}</td><td><span class="pill ${c[t.status]}">${t.status}</span></td><td class="muted" style="font-size:13px">${NYD.ago(t.createdAt)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="tbl-wrap"><div class="empty"><b>没有工单</b>遇到无法连接、卡顿等问题，随时提交。</div></div>`);
}

/* ---------- 设置 ---------- */
function vSettings() {
  $('v-settings').innerHTML = `<h2>账户设置</h2><div class="panel" style="max-width:560px"><h3>基本信息</h3>
    <div class="field"><label>登录邮箱</label><input class="input" value="${U.email}" disabled></div>
    <div class="row2"><div class="field"><label>微信号</label><input class="input" id="s-wx" value="${U.wechat || ''}"></div><div class="field"><label>Telegram</label><input class="input" id="s-tg" value="${U.telegram || ''}"></div></div>
    <button class="btn btn-primary" id="s-save">保存</button></div>
    <div class="panel" style="max-width:560px"><h3>修改密码</h3><div class="field"><label>当前密码</label><input class="input" type="password"></div><div class="field"><label>新密码<small>至少 8 位</small></label><input class="input" type="password"></div><button class="btn btn-line" onclick="NYD.toast('原型：密码已更新')">更新密码</button></div>
    <div class="panel" style="max-width:560px"><h3>通知</h3><label class="check" style="margin-bottom:12px"><input type="checkbox" checked><span>到期前 7 / 3 / 1 天邮件提醒</span></label><label class="check"><input type="checkbox" checked><span>订单状态变化时通知我</span></label></div>`;
  $('s-save').onclick = () => { U.wechat = $('s-wx').value.trim(); U.telegram = $('s-tg').value.trim(); NYD.save(); NYD.toast('已保存'); };
}

/* ---------- 路由 ---------- */
function route() {
  let v = location.hash.slice(1); if (!VIEWS.includes(v)) v = 'overview';
  VIEWS.forEach(x => { $('v-' + x).classList.toggle('on', x === v); document.querySelector(`[data-v=${x}]`).classList.toggle('on', x === v); });
  ({ overview: vOverview, orders: vOrders, devices: vDevices, tickets: vTickets, settings: vSettings })[v]();
  const n = NYD.myOrders().filter(o => o.status === 'pending').length, c = $('cnt-orders'); c.style.display = n ? '' : 'none'; c.textContent = n;
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route); route();
['renew', 'ticket'].forEach(id => $('modal-' + id).addEventListener('click', e => { if (e.target.id === 'modal-' + id) NYD.closeModal(id); }));
</script>
</body>
</html>
