# 本地开发依赖：docker compose -f infra/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: nyd, POSTGRES_PASSWORD: nyd, POSTGRES_DB: nyd }
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ['6379:6379']
volumes:
  pgdata:
